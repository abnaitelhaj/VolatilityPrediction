[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "volpred"
version = "0.1.0"
description = "Bitcoin realized-volatility forecasting (classical + LSTM)"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
